<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/L Mission: S to A Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <nav class="bg-gray-800 border-b border-gray-700 p-4 shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-blue-500 tracking-wider">Zero to Hero <span class="text-white text-sm font-normal bg-blue-600 px-2 py-1 rounded ml-2">4-Month Timeline</span></h1>
            <div class="text-sm text-gray-400" id="currentDate"></div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">
            
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-green-400">Mission Progress</h2>
                <div class="relative pt-1">
                    <div class="flex mb-2 items-center justify-between">
                        <div>
                            <span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-green-600 bg-green-200" id="daysLeftBadge">
                                Days Left: 120
                            </span>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-semibold inline-block text-green-400" id="progressPercent">
                                0%
                            </span>
                        </div>
                    </div>
                    <div class="overflow-hidden h-2 mb-4 text-xs flex rounded bg-gray-700">
                        <div id="progressBar" style="width: 0%" class="shadow-none flex flex-col text-center whitespace-nowrap text-white justify-center bg-green-500 transition-all duration-500"></div>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-yellow-400">Today's Action Plan</h2>
                    <button onclick="resetTasks()" class="text-sm bg-gray-700 hover:bg-gray-600 px-3 py-1 rounded transition">Reset Day</button>
                </div>
                
                <div class="space-y-3" id="taskList">
                    </div>
            </div>
        </div>

        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-md h-fit">
            <h2 class="text-xl font-semibold mb-4 text-purple-400">Part A Marks Tracker (Out of 50)</h2>
            <p class="text-xs text-gray-400 mb-4">Physics/Chem MCQ ලකුණු සහ Maths A කොටසේ ප්‍රශ්න 10 ලකුණු (50ට හරවලා) මෙතනට දාන්න.</p>
            
            <div class="flex space-x-2 mb-6">
                <select id="subjectSelect" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
                    <option value="physics">Physics</option>
                    <option value="chemistry">Chemistry</option>
                    <option value="maths">Combined Maths</option>
                </select>
                <input type="number" id="markInput" placeholder="Marks" min="0" max="50" class="bg-gray-700 border border-gray-600 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-24 p-2.5">
                <button onclick="addMark()" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition">Add</button>
            </div>

            <div class="relative h-64 w-full">
                <canvas id="marksChart"></canvas>
            </div>
        </div>

    </main>

    <script>
        // --- 1. Date & Progress Logic (Fixed for real-time tracking) ---
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('si-LK', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        function updateProgress() {
            const now = new Date().getTime();
            
            // Using a new key (_v2) to reset your previous data and start fresh today
            let storedStart = localStorage.getItem('missionStart_v2');
            if(!storedStart) {
                localStorage.setItem('missionStart_v2', now);
                storedStart = now;
            }
            
            const endDate = parseInt(storedStart) + (120 * 24 * 60 * 60 * 1000); // 120 days from start date
            const totalDuration = endDate - parseInt(storedStart);
            const passed = now - parseInt(storedStart);
            
            let percent = Math.min(Math.max((passed / totalDuration) * 100, 0), 100);
            let daysLeft = Math.ceil((endDate - now) / (1000 * 60 * 60 * 24));
            
            // Failsafe if days go negative
            if (daysLeft < 0) daysLeft = 0;

            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressPercent').innerText = percent.toFixed(1) + '%';
            document.getElementById('daysLeftBadge').innerText = `Days Left: ${daysLeft}`;
        }
        updateProgress();

        // --- 2. Task List Logic (Updated for Maths) ---
        const defaultTasks = [
            { id: 1, subject: 'Maths', text: '05:00 AM - 08:30 AM: Pure Maths Past Paper (Part A කෙටි ප්‍රශ්න 10 + 1 Essay)', done: false },
            { id: 2, subject: 'Physics', text: '09:30 AM - 01:00 PM: Mechanics Concepts via NotebookLM summary', done: false },
            { id: 3, subject: 'Chemistry', text: '02:30 PM - 06:00 PM: Organic Conversions (10 Reactions map)', done: false },
            { id: 4, subject: 'All', text: '07:00 PM - 10:30 PM: Marking Scheme Analysis & Corrections', done: false },
        ];

        let tasks = JSON.parse(localStorage.getItem('alTasks_v2')) || defaultTasks;

        function renderTasks() {
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            
            tasks.forEach(task => {
                const subjectColor = task.subject === 'Maths' ? 'border-blue-500' : 
                                     task.subject === 'Physics' ? 'border-red-500' : 
                                     task.subject === 'Chemistry' ? 'border-green-500' : 'border-gray-500';
                
                const taskDiv = document.createElement('div');
                taskDiv.className = `flex items-center p-4 bg-gray-700 rounded-lg border-l-4 ${subjectColor} hover:bg-gray-600 transition cursor-pointer`;
                taskDiv.onclick = () => toggleTask(task.id);
                
                taskDiv.innerHTML = `
                    <input type="checkbox" class="w-5 h-5 text-blue-600 bg-gray-800 border-gray-500 rounded focus:ring-blue-500 focus:ring-2 pointer-events-none" ${task.done ? 'checked' : ''}>
                    <div class="ml-4 flex-1">
                        <p class="text-sm font-medium ${task.done ? 'line-through text-gray-400' : 'text-gray-100'}">${task.text}</p>
                    </div>
                `;
                list.appendChild(taskDiv);
            });
            localStorage.setItem('alTasks_v2', JSON.stringify(tasks));
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            task.done = !task.done;
            renderTasks();
        }

        function resetTasks() {
            tasks.forEach(t => t.done = false);
            renderTasks();
        }
        renderTasks();

        // --- 3. Chart & Marks Logic (Resetting Demo Data) ---
        let marksData = JSON.parse(localStorage.getItem('alMarksData_v2')) || {
            labels: [], // Starting fresh
            datasets: [
                { label: 'Physics', data: [], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', tension: 0.3, fill: true },
                { label: 'Chemistry', data: [], borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', tension: 0.3, fill: true },
                { label: 'Maths', data: [], borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', tension: 0.3, fill: true }
            ]
        };

        const ctx = document.getElementById('marksChart').getContext('2d');
        const marksChart = new Chart(ctx, {
            type: 'line',
            data: marksData,
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, max: 50, grid: { color: '#374151' }, ticks: { color: '#9ca3af' } },
                    x: { grid: { color: '#374151' }, ticks: { color: '#9ca3af' } }
                },
                plugins: { legend: { labels: { color: '#e5e7eb' } } }
            }
        });

        function addMark() {
            const subject = document.getElementById('subjectSelect').value;
            const mark = parseInt(document.getElementById('markInput').value);
            
            if (isNaN(mark) || mark < 0 || mark > 50) return alert('Enter a valid mark between 0 and 50');

            const datasetIndex = subject === 'physics' ? 0 : subject === 'chemistry' ? 1 : 2;
            
            // Calculate which paper/day number this is to add a proper label
            const currentDataLength = marksData.datasets[datasetIndex].data.length;
            const labelName = `Paper ${currentDataLength + 1}`;
            
            // Only add a new label if it doesn't exist to keep the graph aligned
            if(!marksData.labels.includes(labelName)) {
                marksData.labels.push(labelName);
            }

            marksData.datasets[datasetIndex].data.push(mark);
            marksChart.update();
            
            localStorage.setItem('alMarksData_v2', JSON.stringify(marksData));
            document.getElementById('markInput').value = '';
        }
    </script>
</body>
</html>
